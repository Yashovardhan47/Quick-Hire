<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Post a Job - Quick Hire</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* keep your existing styles (unchanged) */
    body { font-family: 'Poppins', sans-serif; background: #f9f9f9; margin: 0; padding: 0; }
    .container { max-width: 700px; margin: 60px auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { text-align: center; color: #333; }
    form { margin-top: 30px; }
    label { display:block; margin-bottom:8px; font-weight:600; color:#333; }
    input, select, textarea { width:100%; padding:10px 12px; margin-bottom:20px; border:1px solid #ccc; border-radius:6px; font-size:15px; font-family:'Poppins',sans-serif; }
    textarea { height:120px; resize:none; }
    .btn-submit { width:100%; background:#007bff; color:#fff; border:none; padding:12px; border-radius:6px; font-size:16px; font-weight:600; cursor:pointer; transition:0.3s; }
    .btn-submit:hover { background:#0056b3; }
    .back-link { display:block; text-align:center; margin-top:20px; color:#007bff; text-decoration:none; }
    .back-link:hover { text-decoration:underline; }
  </style>
</head>
<body style="background-color:aqua;">

  <div class="container">
    <h1>Post a New Job</h1>

    <form id="jobForm" autocomplete="off">
      <label for="title">Job Title</label>
      <input id="title" name="title" type="text" required placeholder="e.g., Software Engineer">

      <label for="company">Company Name</label>
      <input id="company" name="company" type="text" required placeholder="e.g., Quick Hire Pvt Ltd">

      <label for="location">Location</label>
      <input id="location" name="location" type="text" required placeholder="e.g., Bengaluru, India">

      <label for="experience">Required Experience</label>
      <select id="experience" name="experience" required>
        <option value="">Select Experience</option>
        <option value="Fresher">Fresher</option>
        <option value="1-3 years">1-3 years</option>
        <option value="3-5 years">3-5 years</option>
        <option value="5+ years">5+ years</option>
      </select>

      <!-- <label for="salary">Salary Range (per annum)</label>
      <input id="salary" name="salary" type="text" placeholder="e.g., ₹6,00,000 - ₹10,00,000"> -->

      <label for="description">Job Description</label>
      <textarea id="description" name="description" required placeholder="Describe responsibilities and requirements"></textarea>

      <button type="submit" class="btn-submit">Post Job</button>
    </form>

    <a href="recruiter_dashboard.html" class="back-link">← Back to Recruiter Dashboard</a>
  </div>

  <script>
    // Robust client-side post/save to localStorage.
    (function(){
      const form = document.getElementById('jobForm');

      form.addEventListener('submit', function (e) {
        e.preventDefault(); // IMPORTANT: prevents page reload before JS runs

        // gather trimmed values
       const job = {
  id: Date.now(), // ✅ unique ID for deletion
  title: (document.getElementById('title').value || '').trim(),
  company: (document.getElementById('company').value || '').trim(),
  location: (document.getElementById('location').value || '').trim(),
  experience: (document.getElementById('experience').value || '').trim(),
  description: (document.getElementById('description').value || '').trim(),
  postedAt: new Date().toISOString()
};


        if (!job.title || !job.company) {
          alert('Please enter both job title and company.');
          return;
        }

        // read existing list or fallback to []
        const key = 'postedJobs';
        let jobs = [];
        try {
          jobs = JSON.parse(localStorage.getItem(key)) || [];
          if (!Array.isArray(jobs)) jobs = [];
        } catch (err) {
          jobs = [];
        }

        // push and save
        jobs.push(job);
        localStorage.setItem(key, JSON.stringify(jobs));

        // UX: success, reset and redirect to dashboard
        alert(`✅ Job posted: ${job.title} @ ${job.company}`);
        form.reset();

        // Redirect to dashboard (you can remove if you want to stay on same page)
        window.location.href = 'recruiter_dashboard.html';
      });
    })();
  </script>
</body>
</html>
