<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter Registration - Quick Hire</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: aqua;
      margin: 0;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 360px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      font-weight: 600;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-family: "Poppins", sans-serif;
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-login:hover {
      background: #0056b3;
    }

    .form-links {
      margin-top: 15px;
    }

    .form-links a {
      text-decoration: none;
      color: #000;
    }

    .form-links a span {
      color:black;
      font-weight: 200;
      text-decoration: none;
      cursor: pointer;
    }

    .form-links a span:hover {
      color: darkblue;
      text-decoration: underline;
    }

    .custom-alert {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .alert-box {
      background: #fff;
      padding: 20px;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      text-align: center;
    }

    .alert-btn {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .alert-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>Join Quick Hire</h1>
      <p>Register as a Recruiter</p>

      <form id="recruiterForm" method="POST" action="/quickhire/register_action_recruiter.php">
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full_name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <div class="form-group">
          <label for="company-name">Company Name</label>
          <input type="text" id="company-name" name="company_name" placeholder="Enter your company name" required>
        </div>

        <div class="form-group">
          <label for="company-website">Company Website</label>
          <input type="text" id="company-website" name="company_website" placeholder="e.g., www.company.com" required>
        </div>

        <button type="submit" class="btn-login">Create Account</button>
        <div class="form-links">
          <a href="recruiter_login.html">Already have an account? <span>Sign In</span></a>
        </div>
      </form>
    </div>
  </div>

 <!--Custom Alert--> 
   <div class="custom-alert" id="customAlert">
    <div class="alert-box">
      <div class="alert-header">Quick Hire says:</div>
      <div class="alert-message" id="alertMessage"></div>
      <button class="alert-btn" id="alertBtn">OK</button>
    </div>
  </div>

  <script>
    function showAlert(message) {
      document.getElementById('alertMessage').innerText = message;
      const alertDiv = document.getElementById('customAlert');
      alertDiv.style.display = 'flex';
      document.getElementById('alertBtn').onclick = function() {
        alertDiv.style.display = 'none';
        if (window.history && window.history.replaceState) {
          const url = new URL(window.location);
          url.search = '';
          window.history.replaceState({}, document.title, url);
        }
      };
    }

    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      if (err === 'email_taken') {
        showAlert('Recruiter already exists with this email.');
      } else if (err === 'invalid') {
        showAlert('Please fill all required fields.');
      }
    });
  </script>
</body>
</html>
