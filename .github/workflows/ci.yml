name: QuickHire AI CI

on:
  push:
    branches: [main, feature/quickhire-evidencegraph]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock
          python -m pip_audit -r ../ai-worker/requirements.txt
      - run: python -m pytest -q
        env:
          PYTHONPATH: .
      - name: Compile optional private AI worker
        run: python -m compileall -q ../ai-worker/app
      - name: Test private AI worker boundary
        run: PYTHONPATH=../ai-worker python -m pytest -q ../ai-worker/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  review-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: review-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: review-demo/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: quickhire
          POSTGRES_USER: quickhire
          POSTGRES_PASSWORD: quickhire-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quickhire -d quickhire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Apply migrations twice to verify idempotency
        run: |
          python -m app.cli.migrate
          python -m app.cli.migrate
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://quickhire:quickhire-ci-password@localhost:5432/quickhire
          AUTO_CREATE_TABLES: "false"

  production-containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, review-demo, migrations]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f backend/Dockerfile -t quickhire-api:ci .
      - name: Build web image
        run: >-
          docker build -f frontend/Dockerfile.production
          --build-arg VITE_API_URL=https://api.quickhire.test/api/v1
          --build-arg VITE_GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com
          -t quickhire-web:ci .
      - name: Build private AI worker image
        run: docker build -f ai-worker/Dockerfile -t quickhire-ai-worker:ci .
      - name: Validate production topology
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
