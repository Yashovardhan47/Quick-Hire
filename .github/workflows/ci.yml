name: QuickHire AI CI

on:
  push:
    branches: [main, feature/quickhire-evidencegraph]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pytest -q
        env:
          PYTHONPATH: .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: quickhire
          POSTGRES_USER: quickhire
          POSTGRES_PASSWORD: quickhire-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quickhire -d quickhire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - name: Apply migrations twice to verify idempotency
        run: |
          python -m app.cli.migrate
          python -m app.cli.migrate
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://quickhire:quickhire-ci-password@localhost:5432/quickhire
          AUTO_CREATE_TABLES: "false"

  production-containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t quickhire-api:ci .
      - name: Build web image
        run: >-
          docker build -f frontend/Dockerfile.production
          --build-arg VITE_API_URL=https://api.quickhire.test/api/v1
          --build-arg VITE_GOOGLE_CLIENT_ID=ci.apps.googleusercontent.com
          -t quickhire-web:ci .
      - name: Validate production topology
        run: |
          cp .env.production.example .env.production
          docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
