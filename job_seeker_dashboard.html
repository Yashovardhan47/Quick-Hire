<!-- This section will show data dynamically -->
<section id="dashboardData" style="

  <script>
    function toggleMenu() {
      document.getElementById('menu').classList.toggle('active');
    }

    // Sample Jobs
    const jobs = [
      { title: "Frontend Developer", company: "TechNova", location: "Remote", type: "Full-Time", status: "" },
      { title: "Data Analyst Intern", company: "DataWorks", location: "Pune", type: "Internship", status: "" },
      { title: "Backend Engineer", company: "InnoSoft", location: "Bangalore", type: "Full-Time", status: "" },
      { title: "Cloud Support Assistant", company: "CloudEdge", location: "Hyderabad", type: "Part-Time", status: "" },
      { title: "Full Stack Developer", company: "TechNova", location: "Mumbai", type: "Full-Time", status: "" },
      { title: "UX Designer", company: "InnoSoft", location: "Noida", type: "Part-Time", status: "" }
    ];

    // Populate company filter
    const companySelect = document.getElementById('company');
    [...new Set(jobs.map(j => j.company))].forEach(c => {
      const option = document.createElement('option');
      option.value = c;
      option.textContent = c;
      companySelect.appendChild(option);
    });

    // Update locations based on selected company
    function updateLocations() {
      const company = companySelect.value;
      const locationSelect = document.getElementById('location');
      locationSelect.innerHTML = "<option value=''>Select Location</option>";
      const locations = [...new Set(jobs.filter(j => j.company === company).map(j => j.location))];
      locations.forEach(loc => {
        const option = document.createElement('option');
        option.value = loc;
        option.textContent = loc;
        locationSelect.appendChild(option);
      });
      fetchJobs();
    }

    // Display jobs on dashboard
    function displayJobs(list) {
      const container = document.getElementById('jobList');
      container.innerHTML = "";

      const appliedJobs = JSON.parse(localStorage.getItem('appliedJobs')) || [];
      const normalize = str => str.trim().toLowerCase();

      // Update status dynamically
      list.forEach(job => {
        const isApplied = appliedJobs.find(j =>
          normalize(j.title) === normalize(job.title) &&
          normalize(j.company) === normalize(job.company)
        );
        job.status = isApplied ? 'Applied' : '';
      });

      // Update applied jobs count
      document.getElementById('appliedCount').textContent = appliedJobs.length;

      if (list.length === 0) {
        container.innerHTML = "<p style='text-align:center;'>No jobs found.</p>";
        return;
      }

      list.forEach((job, index) => {
        container.innerHTML += `
          <div class="job-card">
            <h3>${job.title}</h3>
            <p>Company: ${job.company}</p>
            <p>Location: ${job.location}</p>
            <p>Type: ${job.type}</p>
            ${job.status ? `<span class="status">${job.status}</span>` : ''}
            <button class="apply-btn" onclick="viewDetails(${index})">
              ${job.status === 'Applied' ? 'Applied' : 'View Details'}
            </button>
          </div>
        `;
      });
    }

    // Filter jobs
    function fetchJobs() {
      const search = document.getElementById('search').value.toLowerCase();
      const company = document.getElementById('company').value;
      const location = document.getElementById('location').value;
      const type = document.getElementById('type').value;

      const filtered = jobs.filter(job =>
        (search === "" || job.title.toLowerCase().includes(search)) &&
        (company === "" || job.company === company) &&
        (location === "" || job.location === location) &&
        (type === "" || job.type === type)
      );

      displayJobs(filtered);
    }

    // Redirect to job_details.html
    function viewDetails(jobIndex) {
      const selectedJob = jobs[jobIndex];
      const appliedJobs = JSON.parse(localStorage.getItem('appliedJobs')) || [];
      const normalize = str => str.trim().toLowerCase();

      const alreadyApplied = appliedJobs.find(j =>
        normalize(j.title) === normalize(selectedJob.title) &&
        normalize(j.company) === normalize(selectedJob.company)
      );

      if (alreadyApplied) {
        alert("You have already applied for this job.");
      } else {
        localStorage.setItem('selectedJob', JSON.stringify(selectedJob));
        window.location.href = 'job_details.html';
      }
    }

    // Show uploaded resume
    function showFileName() {
      const input = document.getElementById('resumeInput');
      const fileName = input.files.length ? input.files[0].name : "";
      const viewLink = document.getElementById('viewResumeLink');

      document.getElementById('resume-file-name').textContent = fileName ? `📄 ${fileName}` : "";

      if (fileName) {
        const fileURL = URL.createObjectURL(input.files[0]);
        viewLink.href = fileURL;
        viewLink.style.display = "inline-block";
      } else {
        viewLink.href = "#";
        viewLink.style.display = "none";
      }
    }

    function logout() {
      window.location.href = 'for_job_seekers.html';
    }

    // On load
    window.onload = () => {
      // Ensure latest avatar by cache-busting served image
      const img = document.getElementById('dashboardProfileImage');
      if (img) img.src = 'jobseeker_profile_image.php?b=' + Date.now();

      // Display jobs with applied status
      fetchJobs();
    };
    // On load
window.onload = () => {
  // Clear applied jobs so none show as applied
  localStorage.removeItem('appliedJobs'); 

  // Load profile image
  const storedImage = localStorage.getItem('jobSeekerProfileImage');
  if (storedImage) document.getElementById('dashboardProfileImage').src = storedImage;

  // Display all jobs as not applied
  fetchJobs();
};

// =================== RECENTLY POSTED JOBS SECTION ===================

// Create the "Recently Posted" section dynamically
function showRecentlyPostedJobs() {
  const dashboardData = document.getElementById("dashboardData");
  dashboardData.innerHTML = `<h2 style="color:#004aad;">Recently Posted Jobs</h2>`;

  const postedJobs = JSON.parse(localStorage.getItem("postedJobs") || "[]");

  if (postedJobs.length === 0) {
    dashboardData.innerHTML += `<p style="color:#666; text-align:center;">No recent jobs posted yet.</p>`;
    return;
  }

  postedJobs.forEach((job, index) => {
    const jobCard = document.createElement("div");
    jobCard.classList.add("job-card");
    jobCard.style.margin = "10px 0";

    jobCard.innerHTML = `
      <h3>${job.title}</h3>
      <p><strong>Company:</strong> ${job.company || "N/A"}</p>
      <p><strong>Location:</strong> ${job.location}</p>
      <p><strong>Type:</strong> ${job.type || "N/A"}</p>
      <p><strong>Description:</strong> ${job.description || "No description provided."}</p>
      <button class="apply-btn" onclick="viewPostedJob(${index})">View Details</button>
      <button class="apply-btn" style="background:#dc3545;" onclick="deletePostedJob(${index})">Delete</button>
    `;

    dashboardData.appendChild(jobCard);
  });
}

// View details of a posted job
function viewPostedJob(index) {
  const postedJobs = JSON.parse(localStorage.getItem("postedJobs") || "[]");
  const selectedJob = postedJobs[index];
  if (!selectedJob) return alert("Job not found.");
  localStorage.setItem("selectedJob", JSON.stringify(selectedJob));
  window.location.href = "job_details.html";
}

// Delete a posted job
function deletePostedJob(index) {
  if (!confirm("Are you sure you want to delete this job?")) return;
  const postedJobs = JSON.parse(localStorage.getItem("postedJobs") || "[]");
  postedJobs.splice(index, 1);
  localStorage.setItem("postedJobs", JSON.stringify(postedJobs));
  showRecentlyPostedJobs(); // Refresh the list
}

// Load Recently Posted Jobs on page load
window.addEventListener("load", () => {
  showRecentlyPostedJobs();
});
function loadRecentJobs() {
  const container = document.getElementById("recentJobs");
  const jobs = JSON.parse(localStorage.getItem("postedJobs") || "[]");

  if (jobs.length === 0) {
    container.innerHTML = "<p style='text-align:center;'>No recent jobs available.</p>";
    return;
  }

  container.innerHTML = "";
  jobs.slice(-5).reverse().forEach(job => {
    container.innerHTML += `
      <div class="job-card">
        <h3>${job.title}</h3>
        <p><strong>Company:</strong> ${job.company}</p>
        <p><strong>Location:</strong> ${job.location}</p>
        <p><strong>Experience:</strong> ${job.experience}</p>
        <p>${job.description}</p>
        <button class="apply-btn">Apply Now</button>
      </div>
    `;
  });
}

window.onload = loadRecentJobs; // ✅ run automatically

// Also refresh avatar when returning to this tab
(function(){
  function refreshAvatar(){
    const img = document.getElementById('dashboardProfileImage');
    if (img) img.src = 'jobseeker_profile_image.php?b=' + Date.now();
  }
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) refreshAvatar();
  });
})();

// Fetch and show last name under avatar
(function(){
  fetch('current_user_name.php', {credentials:'include'})
    .then(r => r && r.ok ? r.json() : null)
    .then(data => {
      const el = document.getElementById('jobseekerLastName');
      if (!el) return;
      if (!data) { el.textContent = ''; return; }
      const email = (data.email || '').toString();
      const local = email.includes('@') ? email.split('@')[0] : '';
      let ln = (data.last_name || '').toString().trim();
      if (!ln) {
        const full = (data.full_name || '').toString().trim();
        if (full) {
          const parts = full.split(/\s+/);
          ln = parts[parts.length - 1];
        }
      }
      if (!ln) ln = local;
      el.textContent = ln || '';
    })
    .catch(()=>{});
})();

  </script>
