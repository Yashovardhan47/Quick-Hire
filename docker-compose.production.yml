services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickhire
      POSTGRES_USER: quickhire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - quickhire_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickhire -d quickhire"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - quickhire_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks: [private]

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    volumes:
      - quickhire_clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 3"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks: [private]

  ai-worker:
    profiles: ["private-ai"]
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
    restart: unless-stopped
    environment:
      AI_WORKER_TOKEN: ${AI_API_KEY:-disabled}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-small}
      WHISPER_LOCAL_MODEL: ${WHISPER_LOCAL_MODEL:-small}
    volumes:
      - quickhire_models:/models
    networks: [private]

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env.production
    command: ["python", "-m", "app.cli.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips=*"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - ./model_artifacts:/app/model_artifacts:ro
    networks: [private, edge]

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.production
    command: ["python", "-m", "app.workers.notifications"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [private]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.production
      args:
        VITE_API_URL: https://${API_DOMAIN:?API_DOMAIN is required}/api/v1
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
    restart: unless-stopped
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - quickhire_caddy_data:/data
      - quickhire_caddy_config:/config
    depends_on: [frontend, backend]
    networks: [edge]

networks:
  private:
    internal: true
  edge:

volumes:
  quickhire_postgres:
  quickhire_redis:
  quickhire_caddy_data:
  quickhire_caddy_config:
  quickhire_clamav:
  quickhire_models:
