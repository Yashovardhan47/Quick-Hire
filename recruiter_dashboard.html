<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruiter Dashboard - Quick Hire</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
      margin: 0;
      background-color: #f4f6f9;
    }
    /* Header */
    header {
      background: #004aad;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
    }

    /* Hamburger menu */
    .hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      gap: 5px;
      margin-left: 10px;
    }

    .hamburger div {
      width: 25px;
      height: 3px;
      background-color: #fff;
      transition: 0.3s;
    }

    /* Navigation menu */
    nav.menu-bar {
      display: flex;
      gap: 20px;
      margin-left: 20px;
    }

    nav.menu-bar a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    nav.menu-bar a:hover {
      color: #ff4d4d;
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .welcome {
      font-size: 1rem;
    }

    .profile-icon img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 2px solid #fff;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .profile-icon img:hover {
      transform: scale(1.1);
    }

    .logout-btn {
      padding: 6px 12px;
      background: #ff4d4d;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .logout-btn:hover {
      background: #e60000;
    }

    /* header button */
    .header-btn { background: #ffffff; color: #004aad; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; }
    .header-btn:hover { background: #eaf2ff; }

    /* Search bar */
    .search-bar {
      display: flex;
      justify-content: center;
      margin: 2rem auto;
      width: 80%;
    }

    .search-bar input {
      width: 70%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px 0 0 6px;
      outline: none;
    }

    .search-bar button {
      padding: 12px 20px;
      border: none;
      background: #004aad;
      color: white;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      font-weight: 600;
    }

    .search-bar button:hover {
      background: #003a84;
    }

    /* Candidate list */
    .candidate-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
      width: 90%;
      margin: auto;
    }

    .candidate-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 20px;
    }

    .candidate-card h3 {
      color: #004aad;
      margin-top: 0;
    }

    .candidate-card p {
      color: #555;
      font-size: 0.9rem;
      margin: 5px 0;
    }

    .card-actions {
      margin-top: 10px;
    }

    .btn {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 8px;
    }

    .btn-view {
      background: #007bff;
      color: white;
    }

    .btn-view:hover {
      background: #0056b3;
    }

    .btn-shortlist {
      background: #28a745;
      color: white;
    }

    .btn-shortlist:hover {
      background: #1e7e34;
    }

    /* Responsive styles */
    @media (max-width: 768px) {
      nav.menu-bar {
        display: none;
        flex-direction: column;
        background: #004aad;
        position: absolute;
        top: 60px;
        left: 0;
        width: 100%;
        padding: 10px 0;
        z-index: 100;
      }

      nav.menu-bar a {
        padding: 10px 20px;
        width: 100%;
      }

      nav.menu-bar.active {
        display: flex;
      }

      .hamburger {
        display: flex;
      }
    }

    /* Custom Alert Styles for shortlist */
    .custom-alert {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .alert-box {
      background: #fff;
      padding: 20px;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      text-align: center;
      font-family: "Poppins", sans-serif;
    }

    .alert-header {
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .alert-message {
      margin-bottom: 15px;
    }

    .alert-btn {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .alert-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div style="display:flex; align-items:center; gap:20px;">
      <div class="logo">Quick Hire</div>
      <div class="hamburger" onclick="toggleMenu()">
        <div></div>
        <div></div>
        <div></div>
      </div>

  <!-- All Filters drawer -->
  <div class="custom-alert" id="filtersDrawer" onclick="if(event.target.id==='filtersDrawer') this.style.display='none'">
    <div class="alert-box" style="width: 520px; text-align: left;">
      <div class="alert-header">All Filters</div>
      <div class="alert-message">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label style="font-size:12px; color:#666;">Location</label>
            <input type="text" id="locationFilterExt" placeholder="e.g., Bangalore" style="width:100%;" />
          </div>
          <div>
            <label style="font-size:12px; color:#666;">Skills</label>
            <input type="text" id="skillsFilter" placeholder="e.g., React, Node" style="width:100%;" />
          </div>
          <div>
            <label style="font-size:12px; color:#666;">Min Experience (years)</label>
            <input type="number" id="minExpFilter" placeholder="0" style="width:100%;" />
          </div>
          <div>
            <label style="font-size:12px; color:#666;">Max Experience (years)</label>
            <input type="number" id="maxExpFilter" placeholder="10" style="width:100%;" />
          </div>
        </div>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
        <button class="alert-btn" type="button" style="background:#6c757d;" onclick="document.getElementById('filtersDrawer').style.display='none'">Close</button>
        <button class="alert-btn" type="button" style="background:#dc3545;" onclick="(function(){var ids=['locationFilterExt','minExpFilter','maxExpFilter','skillsFilter'];ids.forEach(function(id){var el=document.getElementById(id);if(el){el.value='';}});var btn=document.getElementById('allFiltersBtn');if(btn){btn.style.background='#eaf2ff';btn.style.color='#004aad';} if(window.renderFilterChips) renderFilterChips(); if(window.searchCandidates) searchCandidates(1); document.getElementById('filtersDrawer').style.display='none';})();">Reset</button>
        <button class="alert-btn" type="button" onclick="(function(){var loc=(document.getElementById('locationFilterExt')||{}).value||'';var min=(document.getElementById('minExpFilter')||{}).value||'';var max=(document.getElementById('maxExpFilter')||{}).value||'';var skl=(document.getElementById('skillsFilter')||{}).value||'';var btn=document.getElementById('allFiltersBtn');if(btn){if(loc.trim()||min.trim()||max.trim()||skl.trim()){btn.style.background='#004aad';btn.style.color='#fff';}else{btn.style.background='#eaf2ff';btn.style.color='#004aad';}} if(window.renderFilterChips) renderFilterChips(); if(window.searchCandidates) searchCandidates(1); document.getElementById('filtersDrawer').style.display='none';})();">Apply</button>
      </div>
    </div>
  </div>
      <nav class="menu-bar" id="menu">
        <a href="index.html">Home</a>
        <a href="post_job.html">Post</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
    <div class="user-profile">
      <span class="welcome">Welcome, Recruiter 👋</span>
      <div class="profile-avatar" style="display:flex; flex-direction:column; align-items:center; line-height:1.1;">
        <a href="recruiter_profile.html" class="profile-icon">
          <img src="recruiter_profile_image.php" alt="Profile">
        </a>
        <div id="recruiterLastName" style="color:#fff; font-weight:700; font-size:0.85rem; margin-top:4px;"></div>
      </div>
      <!-- <a href="recruiter_profile.html" class="header-btn">Profile</a> -->
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- Search bar (LinkedIn-like) -->
  <section class="search-bar" style="flex-wrap:wrap; gap:8px;">
    <input type="text" id="search" placeholder="Search candidates (e.g., React developer, Bangalore)" style="flex:1; min-width:260px;" />
    <button id="allFiltersBtn" class="btn" style="background:#eaf2ff; color:#004aad;" onclick="document.getElementById('filtersDrawer').style.display='flex'">All Filters</button>
    <select id="sortFilter" style="margin-left:8px;">
      <option value="relevance">Relevance</option>
      <option value="name">Name</option>
      <option value="experience_desc">Experience: High to Low</option>
      <option value="experience_asc">Experience: Low to High</option>
    </select>
    <button class="btn" style="background:#004aad; color:#fff;" onclick="searchCandidates()">Search</button>
    <div id="filterChips" style="width:100%; display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;"></div>
  </section>

  <!-- Candidate list -->
  <section class="candidate-list" id="candidateList">
    <!-- Candidate cards will be loaded here -->
  </section>

  <!-- Results meta and pagination -->
  <div style="width:90%; margin:8px auto; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
    <div id="resultsInfo" style="color:#666; font-size:0.9rem;"></div>
    <div style="display:flex; align-items:center; gap:8px;">
      <label for="pageSizeSelect" style="color:#666; font-size:0.9rem;">Page size</label>
      <select id="pageSizeSelect" style="padding:6px 8px;">
        <option value="10">10</option>
        <option value="20" selected>20</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div>
  </div>
  <div id="paginationControls" style="width:90%; margin:8px auto; display:flex; gap:6px; flex-wrap:wrap;"></div>

  <!-- Custom shortlist alert -->
  <div class="custom-alert" id="hiredAlert">
    <div class="alert-box">
      <div class="alert-header">Quick Hire says:</div>
      <div class="alert-message" id="hiredMessage"></div>
      <button class="alert-btn" onclick="closeHiredAlert()">OK</button>
    </div>
  </div>

  <!-- Jobseeker details modal -->
  <div class="custom-alert" id="profileModal">
    <div class="alert-box" style="width: 420px; text-align: left;">
      <div class="alert-header">Candidate Details</div>
      <div class="alert-message">
        <div><strong>Name:</strong> <span id="js_name"></span></div>
        <div><strong>Email:</strong> <span id="js_email"></span></div>
        <div><strong>Location:</strong> <span id="js_location"></span></div>
        <div><strong>Experience:</strong> <span id="js_experience"></span> years</div>
        <div><strong>Skills:</strong> <span id="js_skills"></span></div>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
        <button class="alert-btn" style="background:#6c757d;" onclick="closeProfileModal()">Close</button>
        <button class="alert-btn" onclick="hireFromModal()">Hire</button>
      </div>
    </div>
  </div>

  <script>
  // ===================== MENU & LOGOUT =====================
  function toggleMenu() {
    document.getElementById("menu").classList.toggle("active");
  }
  function logout() {
    window.location.href = "for_recruiters.html";
  }

  // ===================== DATA SETUP =====================
  const candidates = [
    { name: "Lakshmi Prasanna", role: "Frontend Developer", skills: "HTML, CSS, React", location: "Bangalore" },
    { name: "Rahul Mehta", role: "Backend Developer", skills: "Node.js, Express, MongoDB", location: "Hyderabad" },
    { name: "Sneha Patel", role: "Data Analyst", skills: "Python, SQL, Power BI", location: "Pune" },
    { name: "Prasanna", role: "Full Stack Engineer", skills: "React, Node.js, MySQL", location: "Delhi" },
    { name: "Priya Nair", role: "UI/UX Designer", skills: "Figma, Adobe XD", location: "Mumbai" },
    { name: "Vikram Rao", role: "DevOps Engineer", skills: "AWS, Docker, Jenkins", location: "Chennai" },
    { name: "Kavya Reddy", role: "Software Tester", skills: "Selenium, API Testing", location: "Bangalore" },
    { name: "Manish Kumar", role: "Mobile App Developer", skills: "Flutter, Kotlin", location: "Noida" },
    { name: "Riya Sen", role: "AI Engineer", skills: "Machine Learning, TensorFlow", location: "Kolkata" },
    { name: "Arjun Gupta", role: "Cybersecurity Specialist", skills: "Ethical Hacking, PenTesting", location: "Hyderabad" }
  ];

  // ===================== JOB STORAGE HELPERS =====================
  function getStoredJobs() {
    return JSON.parse(localStorage.getItem("postedJobs") || "[]");
  }

  function saveJobs(jobs) {
    localStorage.setItem("postedJobs", JSON.stringify(jobs));
  }

  // ===================== GLOBAL VARIABLES =====================
  let shortlisted = new Set();
  let currentProfile = null; // holds last fetched jobseeker details for modal
  let currentPage = 1;
  let pageSize = 20;
  let lastTotal = 0;
  let isLoading = false;
  let lastExternalItems = [];

  // ===================== DISPLAY FUNCTIONS =====================
  function displayCandidates(list) {
    const container = document.getElementById("candidateList");
    container.innerHTML = "";

    if (list.length === 0) {
      container.innerHTML = "<p style='text-align:center;'>No candidates or jobs found.</p>";
      return;
    }

    list.forEach(item => {
      container.innerHTML += `
        <div class="candidate-card">
          <h3>${item.isJob ? item.role + " (Job)" : (item.name || item.full_name || '')}</h3>
          <p><strong>${item.isJob ? "Description" : "Skills"}:</strong> ${item.skills || ''}</p>
          <p><strong>Location:</strong> ${item.location}</p>
          <div class="card-actions">
            ${item.isJob 
              ? `<button class=\"btn btn-view\" onclick=\"viewProfile('${item.role}')\">View</button>`
              : (item.source === 'external' && item.ext_id
                  ? `<button class=\"btn btn-view\" onclick=\"viewJobseekerExternal('${item.ext_id}')\">View</button>`
                  : (item.js_id
                      ? `<button class=\"btn btn-view\" onclick=\"viewJobseeker(${item.js_id})\">View</button>`
                      : `<button class=\"btn btn-view\" onclick=\"viewProfile('${item.name}')\">View</button>`))
            }
            ${item.isJob 
              ? `<button class=\"btn btn-delete\" style=\"background:#dc3545;\" onclick=\"deleteJob(${item.id})\">Delete</button>`
              : (item.js_id
                  ? `<button class=\"btn\" style=\"background:#ff9800; color:#fff;\" onclick=\"hireJobseekerByEmail('${item.js_email}', '${(item.full_name || '').replace(/'/g, "\\'")}')\">Hire</button>`
                  : (!shortlisted.has(item.name) 
                      ? `<button class=\"btn btn-shortlist\" onclick=\"shortlist('${item.name}')\">Shortlist</button>` 
                      : `<button class=\"btn btn-shortlist\" style=\"background:#6c757d;\" disabled>Shortlisted</button>`))
            }
          </div>
        </div>
      `;
    });
  }

  function displayShortlisted() {
    const container = document.getElementById("shortlistedList");
    container.innerHTML = "";

    if (shortlisted.size === 0) {
      container.innerHTML = "<p style='text-align:center;'>No candidates shortlisted yet.</p>";
      return;
    }

    shortlisted.forEach(name => {
      const c = candidates.find(c => c.name === name);
      container.innerHTML += `
        <div class="candidate-card" style="border-left:5px solid #28a745;">
          <h3>${c.name}</h3>
          <p><strong>Role:</strong> ${c.role}</p>
          <p><strong>Skills:</strong> ${c.skills}</p>
          <p><strong>Location:</strong> ${c.location}</p>
          <div class="card-actions">
            <button class="btn btn-view" onclick="viewProfile('${c.name}')">View</button>
            <button class="btn btn-shortlist" style="background:#6c757d;" disabled>Shortlisted</button>
          </div>
        </div>
      `;
    });
  }

  function displayRecentJobs() {
    const container = document.getElementById("recentJobs");
    const jobs = getStoredJobs();

    if (!container) return;

    if (jobs.length === 0) {
      container.innerHTML = "<p style='text-align:center;'>No jobs posted yet.</p>";
      return;
    }

    container.innerHTML = "";
    jobs.slice(-5).reverse().forEach(job => {
      container.innerHTML += `
        <div class="candidate-card">
          <h3>${job.title}</h3>
          <p><strong>Company:</strong> ${job.company}</p>
          <p><strong>Location:</strong> ${job.location}</p>
          <p><strong>Experience:</strong> ${job.experience}</p>
          <p><strong>Description:</strong> ${job.description}</p>
          <div class="card-actions">
            <button class="btn btn-view" onclick="viewProfile('${job.title}')">View</button>
            <button class="btn btn-delete" style="background:#dc3545;" onclick="deleteJob(${job.id})">Delete</button>
          </div>
        </div>`;
    });
  }

  // ===================== ACTIONS =====================
  function viewProfile(name) {
    alert(`Opening details for ${name}...`);
  }

  async function viewJobseeker(id){
    try {
      const res = await fetch(`get_jobseeker.php?id=${encodeURIComponent(id)}`, {credentials:'include'});
      const data = await res.json();
      if (!res.ok || !data || data.error){
        console.error('Search API error', data);
        displayCandidates([]);
        renderResultsInfo(0, 1, pageSize);
        renderPagination(0, 1, pageSize);
        return;
      }
      currentProfile = data.item;
      document.getElementById('js_name').textContent = currentProfile.full_name || '';
      document.getElementById('js_email').textContent = currentProfile.email || '';
      document.getElementById('js_location').textContent = currentProfile.location || '';
      document.getElementById('js_experience').textContent = (currentProfile.experience ?? '')
      document.getElementById('js_skills').textContent = currentProfile.skills || '';
      document.getElementById('profileModal').style.display = 'flex';
    } catch (e){
      console.error('Search API network error', e);
      displayCandidates([]);
      renderResultsInfo(0, 1, pageSize);
      renderPagination(0, 1, pageSize);
    } finally {
      isLoading = false;
    }
  }

  async function viewJobseekerExternal(id){
    // Try to use last external items (no extra API call)
    const found = (lastExternalItems||[]).find(it => String(it.id) === String(id));
    if (found){
      currentProfile = {
        full_name: found.full_name,
        email: found.email || '',
        location: found.location || '',
        experience: found.experience ?? '',
        skills: found.skills || ''
      };
      document.getElementById('js_name').textContent = currentProfile.full_name || '';
      document.getElementById('js_email').textContent = currentProfile.email || '';
      document.getElementById('js_location').textContent = currentProfile.location || '';
      document.getElementById('js_experience').textContent = (currentProfile.experience ?? '');
      document.getElementById('js_skills').textContent = currentProfile.skills || '';
      document.getElementById('profileModal').style.display = 'flex';
      return;
    }
    // Fallback to external_get_jobseeker if available
    try {
      const res = await fetch(`external_get_jobseeker.php?id=${encodeURIComponent(id)}`, {credentials:'include'});
      const data = await res.json();
      if (!res.ok || !data || data.error){
        alert('Failed to load candidate details');
        return;
      }
      currentProfile = data.item;
      document.getElementById('js_name').textContent = currentProfile.full_name || '';
      document.getElementById('js_email').textContent = currentProfile.email || '';
      document.getElementById('js_location').textContent = currentProfile.location || '';
      document.getElementById('js_experience').textContent = (currentProfile.experience ?? '');
      document.getElementById('js_skills').textContent = currentProfile.skills || '';
      document.getElementById('profileModal').style.display = 'flex';
    } catch (e){
      alert('Network error while loading details');
    }
  }

  function closeProfileModal(){
    document.getElementById('profileModal').style.display = 'none';
  }

  function hireFromModal(){
    if (currentProfile && currentProfile.email){
      hireJobseekerByEmail(currentProfile.email, currentProfile.full_name);
    } else {
      document.getElementById('hiredMessage').innerText = 'No email available for this candidate.';
      document.getElementById('hiredAlert').style.display = 'flex';
    }
  }

  function shortlist(name) {
    shortlisted.add(name);
    document.getElementById("hiredMessage").innerText = `You shortlisted ${name}! 🎉`;
    document.getElementById("hiredAlert").style.display = "flex";
    refreshAll();
  }

  async function hireJobseekerByEmail(email, displayName) {
    try {
      const form = new FormData();
      form.append('jobseeker_email', email);
      const res = await fetch('hire_jobseeker.php', {
        method: 'POST',
        credentials: 'include',
        body: form
      });
      let data = null;
      try { data = await res.json(); } catch (_) {}
      if (!res.ok || !data || data.error) {
        const msg = (data && data.error) ? data.error : 'request_failed';
        document.getElementById('hiredMessage').innerText = `Failed to hire ${displayName || email}: ${msg}`;
        document.getElementById('hiredAlert').style.display = 'flex';
        return;
      }
      document.getElementById('hiredMessage').innerText = data.message || `Hired ${displayName || email}!`;
      document.getElementById('hiredAlert').style.display = 'flex';
    } catch (e) {
      document.getElementById('hiredMessage').innerText = `Failed to hire ${displayName || email}: network_error`;
      document.getElementById('hiredAlert').style.display = 'flex';
    }
  }

  function hireJobseekerPrompt(name) {
    const email = prompt(`Enter email of ${name} to hire:`);
    if (!email) return;
    hireJobseekerByEmail(email, name);
  }

  // ===================== SEARCH (API) =====================
  async function searchCandidates(page=1){
    const q = (document.getElementById('search')?.value || '').trim();
    const locationVal = (document.getElementById('locationFilterExt')?.value || '').trim();
    const minExpVal = (document.getElementById('minExpFilter')?.value || '').trim();
    const maxExpVal = (document.getElementById('maxExpFilter')?.value || '').trim();
    const skillsVal = (document.getElementById('skillsFilter')?.value || '').trim();
    const sortVal = (document.getElementById('sortFilter')?.value || 'relevance');

    const params = new URLSearchParams({ q, page: String(page), page_size: String(pageSize), sort: sortVal });
    if (locationVal) params.set('location', locationVal);
    if (minExpVal !== '') params.set('min_exp', minExpVal);
    if (maxExpVal !== '') params.set('max_exp', maxExpVal);
    if (skillsVal) params.set('skills', skillsVal);
    // loading state
    const container = document.getElementById('candidateList');
    if (container){ container.innerHTML = '<p style="text-align:center; color:#666;">Loading results...</p>'; }
    isLoading = true;
    try {
      const res = await fetch(`/quickhire/search_jobseekers.php?${params.toString()}`, {credentials:'include'});
      const data = await res.json();
      if (!res.ok || !data || data.error){
        console.error('Search API error', data);
        displayCandidates([]);
        renderResultsInfo(0, 1, pageSize);
        renderPagination(0, 1, pageSize);
        return;
      }
      lastExternalItems = data.items || [];
      const mapped = (lastExternalItems).map(it => ({
        js_id: it.id,
        full_name: it.full_name,
        name: it.full_name,
        skills: it.skills || '',
        location: it.location || '',
        js_email: it.email || ''
      }));
      currentPage = page;
      lastTotal = data.total || 0;
      displayCandidates(mapped);
      renderResultsInfo(lastTotal, currentPage, pageSize);
      renderPagination(lastTotal, currentPage, pageSize);
      // Sync URL params
      const urlParams = new URLSearchParams(params);
      history.replaceState(null, '', `${location.pathname}?${urlParams.toString()}`);
    } catch (e){
      console.error('Search API network error', e);
      displayCandidates([]);
      renderResultsInfo(0, 1, pageSize);
      renderPagination(0, 1, pageSize);
    } finally {
      isLoading = false;
    }
  }

  function deleteJob(id) {
    if (!confirm("Are you sure you want to delete this job?")) return;
    let jobs = getStoredJobs();
    jobs = jobs.filter(job => job.id !== id);
    saveJobs(jobs);
    refreshAll();
  }

  function closeHiredAlert() {
    document.getElementById("hiredAlert").style.display = "none";
  }

  // ===================== FILTER FUNCTION =====================
  function applyFilters() {
    const role = document.getElementById("roleFilter").value;
    const skill = document.getElementById("skillFilter").value;
    const location = document.getElementById("locationFilter").value;

    const jobs = getStoredJobs().map(job => ({
      name: job.title + " Job",
      role: job.title,
      skills: job.description,
      location: job.location,
      id: job.id,
      isJob: true
    }));

    const allEntries = [...candidates, ...jobs];

    const results = allEntries.filter(c => {
      const matchesRole = role ? c.role === role : true;
      const matchesSkill = skill ? c.skills.includes(skill) : true;
      const matchesLocation = location ? c.location === location : true;
      return matchesRole && matchesSkill && matchesLocation;
    });

    displayCandidates(results);
  }

  // ===================== REFRESH DASHBOARD =====================
  function refreshAll() {
    const jobs = getStoredJobs().map(job => ({
      name: job.title + " Job",
      role: job.title,
      skills: job.description,
      location: job.location,
      id: job.id,
      isJob: true
    }));
    // Do not populate main results from local demo/jobs; keep results driven by search API
    displayCandidates([]);
    displayShortlisted();
    displayRecentJobs();
  }

  // ===================== PAGE LOAD =====================
  window.onload = () => {
    const usp = new URLSearchParams(location.search);
    const setIf = (id,key)=>{ const v = usp.get(key); if (v!==null && document.getElementById(id)) document.getElementById(id).value = v; };
    setIf('search','q');
    setIf('locationFilterExt','location');
    setIf('minExpFilter','min_exp');
    setIf('maxExpFilter','max_exp');
    setIf('skillsFilter','skills');
    setIf('sortFilter','sort');
    const ps = parseInt(usp.get('page_size')||'',10);
    if (!isNaN(ps) && document.getElementById('pageSizeSelect')){ pageSize = ps; document.getElementById('pageSizeSelect').value = String(ps); }

    renderFilterChips();
    const pageParam = parseInt(usp.get('page') || '1', 10);
    searchCandidates(isNaN(pageParam)?1:pageParam);

    const psel = document.getElementById('pageSizeSelect');
    if (psel){ psel.addEventListener('change', function(){ pageSize = parseInt(this.value, 10) || 20; searchCandidates(1); }); }
  };

// Ensure profile image reflects latest upload by cache-busting
(function(){
  function refreshProfileImage(){
    const img = document.querySelector('.profile-icon img');
    if (img){
      const bust = Date.now();
      img.src = 'recruiter_profile_image.php?b=' + bust;
    }
  }
  // On load
  refreshProfileImage();
  // When returning to tab
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) refreshProfileImage();
  });
})();

// Fetch and show last name under avatar
(function(){
  fetch('current_user_name.php', {credentials:'include'})
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (data && data.last_name) {
        const el = document.getElementById('recruiterLastName');
        if (el) el.textContent = data.last_name;
      }
    })
    .catch(()=>{});
})();
