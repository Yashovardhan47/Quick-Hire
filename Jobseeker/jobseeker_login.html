<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Hire - Job Seeker Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: rgb(248, 211, 144);
      margin: 0;
      font-family: "Poppins", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-box {
      background: white;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      width: 350px;
      text-align: center;
    }

    h1.login-title { margin-bottom: 20px; color: #004aad; }

    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }

    .btn-login { width: 100%; padding: 10px; background:#004aad; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:600; }
    .btn-login:hover { background:#003a84; }

    .form-links { margin-top: 15px; font-size: 0.9rem; }
    .a:hover, .b:hover, .fp:hover, .dha:hover { text-decoration: underline; cursor: pointer; color: blue; }

    /* Custom Alert */
    .custom-alert {
      display: none;
      position: fixed;
      top:0; left:0; right:0; bottom:0;
      background: rgba(0,0,0,0.5);
      justify-content:center;
      align-items:center;
      z-index:9999;
    }

    .alert-box { background:#fff; padding:20px; width:300px; border-radius:10px; text-align:center; font-family:"Poppins", sans-serif; }
    .alert-header { font-weight:bold; margin-bottom:10px; color:#333; }
    .alert-message { margin-bottom:15px; }
    .alert-btn { padding:8px 16px; background:#007bff; color:white; border:none; border-radius:5px; cursor:pointer; }
    .alert-btn:hover { background:#0056b3; }
  </style>
</head>
<body>

  <div class="login-box">
    <h1 class="login-title">Sign In - Job Seeker</h1>

    <form id="job-seeker-form" method="POST" action="login_jobseeker.php">

      <div class="form-group">
        <label for="js-email">Email Address</label>
        <input type="email" id="js-email" name="js-email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="js-password">Password</label>
        <input type="password" id="js-password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn-login">Sign In</button>
      <div class="form-links">
        <a href="#"><span class="b">Forgot Password?</span></a>
        <span> | </span>
        <a href="jobseeker_register.html"><span class="a">Don't have an account</span></a>
      </div>
    </form>
  </div>

  <!-- Custom Alert -->
  <div class="custom-alert" id="customAlert">
    <div class="alert-box">
      <div class="alert-header">Quick Hire says:</div>
      <div class="alert-message" id="alertMessage"></div>
      <button class="alert-btn" onclick="closeAlert()">OK</button>
    </div>
  </div>

  <!-- Forgot Password -->
  <div class="custom-alert" id="forgotPasswordBox">
    <div class="alert-box">
      <div class="alert-header">Reset Password</div>
      <div class="alert-message">
        <p>Enter your registered email to receive a password reset link:</p>
        <input type="email" id="resetEmail" placeholder="Enter your email" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:5px;">
      </div>
      <button class="alert-btn" onclick="sendResetLink()">Send Reset Link</button>
      <button class="alert-btn" style="background:#6c757d; margin-left:8px;" onclick="closeForgotBox()">Cancel</button>
    </div>
  </div>

  <script>
    function showCustomAlert(message, redirect=null){ 
      document.getElementById("alertMessage").innerText=message; 
      document.getElementById("customAlert").style.display="flex"; 
      if(redirect){ document.getElementById("customAlert").dataset.redirect=redirect; } 
      else { delete document.getElementById("customAlert").dataset.redirect; } 
    }
    function closeAlert(){ 
      const alertBox=document.getElementById("customAlert"); 
      alertBox.style.display="none"; 
      if(alertBox.dataset.redirect){ window.location.href=alertBox.dataset.redirect; } 
    }
    // Server-driven messages via URL params
    document.addEventListener('DOMContentLoaded', function(){
      const params = new URLSearchParams(window.location.search);
      if (params.get('registered') === '1') {
        showCustomAlert('Registration successful. Please sign in.');
      } else if (params.get('error') === 'invalid') {
        showCustomAlert('Please enter both email and password.');
      } else if (params.get('error') === '1') {
        showCustomAlert('Invalid email or password.');
      }
    });

    // Forgot password
    document.querySelector(".b").addEventListener("click",function(e){ 
      e.preventDefault(); 
      document.getElementById("forgotPasswordBox").style.display="flex"; 
    });
    function closeForgotBox(){ document.getElementById("forgotPasswordBox").style.display="none"; }
    function sendResetLink(){ 
      const email=document.getElementById("resetEmail").value.trim(); 
      if(email===""){ alert("Please enter your email address."); return; } 
      closeForgotBox(); 
      showCustomAlert("A password reset link has been sent to " + email + "."); 
    }
// Form now submits to server for authentication
  </script>

</body>
</html>
