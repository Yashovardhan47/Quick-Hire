<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Quick Hire</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: aqua;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: white;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 360px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: #007bff;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      font-weight: 600;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
      font-family: "Poppins", sans-serif;
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-login:hover {
      background: #0056b3;
    }

    .form-links {
      margin-top: 15px;
    }

    .form-links a {
      text-decoration: none;
      color: #000;
      font-weight: 500;
    }

    /* Custom Alert */
    .custom-alert {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .alert-box {
      background: #fff;
      padding: 20px;
      width: 320px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      text-align: center;
    }

    .alert-header {
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }

    .alert-btn {
      padding: 8px 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .alert-btn:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Admin Login</h1>
    <form id="adminLoginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter admin username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="btn-login">Login</button>

      <div class="form-links">
        <a href="index.html">← Back to Home</a>
      </div>
    </form>
  </div>

  <!-- Custom Alert -->
  <div class="custom-alert" id="customAlert">
    <div class="alert-box">
      <div class="alert-header">Quick Hire says:</div>
      <div class="alert-message" id="alertMessage"></div>
      <button class="alert-btn" id="alertBtn">OK</button>
    </div>
  </div>

  <script>
    // Admin credentials (you can later connect to a backend)
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "admin123";

    function showAlert(message, callback) {
      document.getElementById('alertMessage').innerText = message;
      document.getElementById('customAlert').style.display = 'flex';
      document.getElementById('alertBtn').onclick = function() {
        document.getElementById('customAlert').style.display = 'none';
        if (callback) callback();
      };
    }

    document.getElementById('adminLoginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      if (username === ADMIN_USER && password === ADMIN_PASS) {
        showAlert("Login successful! Redirecting to Admin Dashboard...", () => {
          window.location.href = "admin_dashboard.html";
        });
      } else {
        showAlert("Invalid username or password. Please try again.");
      }
    });
  </script>

</body>
</html>
