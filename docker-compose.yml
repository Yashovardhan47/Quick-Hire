services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: quickhire
      POSTGRES_USER: quickhire
      POSTGRES_PASSWORD: quickhire
    ports:
      - "5432:5432"
    volumes:
      - quickhire_postgres:/var/lib/postgresql/data
      - ./database/initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickhire -d quickhire"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-worker:
    profiles: ["neural-ai"]
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
    environment:
      AI_WORKER_TOKEN: ${AI_API_KEY:-local-neural-worker-token}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      RERANKER_MODEL: ${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-small}
      WHISPER_LOCAL_MODEL: ${WHISPER_LOCAL_MODEL:-small}
    volumes:
      - quickhire_models:/models
    ports:
      - "8100:8100"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  quickhire_postgres:
  quickhire_models:
